<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="HealthSync logo">
    <title>HealthSync</title>
    <defs>
        <linearGradient id="hsAccent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFB347" />
            <stop offset="100%" stop-color="#E4840F" />
        </linearGradient>
    </defs>

    <g transform="rotate(-90 128 128)" fill="none" stroke-linecap="round">
        <!-- Calorie ring (outer) - 75% -->
        <circle cx="128" cy="128" r="96" stroke="#2A2A2E" stroke-width="10" opacity="0.25" />
        <circle cx="128" cy="128" r="96" stroke="url(#hsAccent)" stroke-width="10"
                        stroke-dasharray="603.19" stroke-dashoffset="150.80" />

        <!-- Protein ring (middle) - 60% -->
        <circle cx="128" cy="128" r="82" stroke="#2A2A2E" stroke-width="9" opacity="0.25" />
        <circle cx="128" cy="128" r="82" stroke="#30D158" stroke-width="9"
                        stroke-dasharray="515.22" stroke-dashoffset="206.09" />

        <!-- Hydration ring (inner) - 85% -->
        <circle cx="128" cy="128" r="68" stroke="#2A2A2E" stroke-width="8" opacity="0.25" />
        <circle cx="128" cy="128" r="68" stroke="#5AC8FA" stroke-width="8"
                        stroke-dasharray="427.26" stroke-dashoffset="64.09" />
    </g>

    <!-- Center heart with embedded pulse -->
    <g transform="translate(128 136)">
        <path d="M0 40 C -40 11 -57 -15 -40 -36 C -26 -51 -7 -47 0 -33 C 7 -47 26 -51 40 -36 C 57 -15 40 11 0 40 Z"
                    fill="#e8282a" />
        <path d="M -28 0 L -15 0 L -7 -14 L 4 15 L 11 -6 L 16 0 L 28 0"
                    fill="none" stroke="#FFFFFF" stroke-width="3.6"
                    stroke-linecap="round" stroke-linejoin="round" />

        <!-- Plus badge: top-right -->
        <circle cx="38" cy="-30" r="13" fill="#FFFFFF" />
        <path d="M38 -37 L38 -23 M31 -30 L45 -30"
                    stroke="#e8282a" stroke-width="3.4"
                    stroke-linecap="round" />
    </g>
</svg>
